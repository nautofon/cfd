---
name: Typeset and publish latest

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

jobs:
  typeset:
    uses: ./.github/workflows/typeset.yml
  publish:
    needs: typeset
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get PDF files
        uses: actions/download-artifact@v8
        with:
          pattern: cfd-*-preview
          merge-multiple: true
      - name: Bundle state chapter files
        run: |
          datename=$( perl -MTime::Piece -e 'print gmtime->strftime("cfd-%y%m%d")' )
          for f in $baseoutname-*.pdf ; do
            cp -v "$f" "$datename-${f#$baseoutname-}"
          done
          zip --move --test -9 $baseoutname.zip $datename-*.pdf
        env:
          baseoutname: 'cfd-latest-preview'
      - name: Bundle old files
        run: |
          zip --test -9 $baseoutname.zip $baseoutname-*.pdf
        env:
          baseoutname: 'cfd-old-preview'
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
